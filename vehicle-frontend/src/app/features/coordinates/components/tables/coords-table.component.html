<div class="table-wrapper">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef (click)="sortFunction('id')">ID</th>
      <td mat-cell *matCellDef="let coordinates">{{ coordinates.id }}</td>
    </ng-container>

    <ng-container matColumnDef="x">
      <th mat-header-cell *matHeaderCellDef (click)="sortFunction('x')">X</th>
      <td mat-cell *matCellDef="let coordinates">{{ coordinates.x }}</td>
    </ng-container>

    <ng-container matColumnDef="y">
      <th mat-header-cell *matHeaderCellDef (click)="sortFunction('y')">Y</th>
      <td mat-cell *matCellDef="let coordinates">{{ coordinates.y }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns;"></tr>
  </table>

  <mat-paginator [length]="(total$ | async) || 0" [pageSize]="10" [pageSizeOptions]="[5,10,15,20,25,30]"></mat-paginator>
</div>
